name: semgrep-selftest

# TEMPORARY: validates the fixtures in semgrep-tests/ against the proposed rule
# pack. Not intended to be merged as-is.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.176.0
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `semgrep test` wants the rules at the root of the directory it is
      # pointed at, so assemble one instead of keeping a second copy of the
      # pack in the tree (a copy would silently drift).
      - name: Assemble self-test directory
        run: |
          mkdir -p /tmp/selftest
          cp .semgrep-proposed.yml /tmp/selftest/rules.yml
          cp -r semgrep-tests/. /tmp/selftest/

      - name: Rule fixtures (proposed pack)
        working-directory: /tmp/selftest
        run: semgrep test .

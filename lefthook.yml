# Fast local mirrors of the CI quality gates (.forgejo/workflows/ci.yml).
#
# One-time setup per clone:
#   lefthook install
#
# Deliberately kept fast so nobody disables them; the expensive gates
# (cargo test --workspace, cargo deny check) run in CI only.
#
# Both rulesets only apply to Rust sources, so each job triggers on staged
# *.rs files. Keep `run` scripts single-line and free of double quotes:
# lefthook executes them via `sh -c "<script>"`, so inner double quotes
# terminate the wrapper's quoting and corrupt the script.

pre-commit:
  jobs:
    - name: rustfmt
      glob: ["*.rs"]
      run: cargo fmt --all -- --check

    # Semgrep is normally installed with `uv tool install semgrep`; skip
    # gracefully when it is unavailable. CI always runs it.
    - name: semgrep
      glob: ["*.rs"]
      run: "if command -v semgrep >/dev/null 2>&1; then semgrep scan --config .semgrep.yml --error {staged_files}; else echo 'semgrep not on PATH, skipping locally (enforced in CI)'; fi"

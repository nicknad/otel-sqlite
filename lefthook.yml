# lefthook configuration
# https://github.com/evilmartians/lefthook

commit-msg:
  commands:
    lint-commit:
      run: echo "commit message ok"

pre-commit:
  parallel: false
  commands:
    tidy:
      run: go mod tidy && git add go.mod go.sum
      stage_fixed: true
      skip:
        - merge
        - rebase

    lint-fix:
      run: golangci-lint run --fix --timeout 2m
      glob: "*.go"
      stage_fixed: true

    vet:
      run: go vet ./...
      glob: "*.go"

pre-push:
  parallel: false
  commands:
    full-lint:
      run: golangci-lint run --timeout 5m

    security:
      run: |
        which gosec >/dev/null 2>&1 || go install github.com/securego/gosec/v2/cmd/gosec@latest
        gosec -quiet -exclude=G104,G304,G115 -exclude-dir internal/generated ./...

    test:
      run: CGO_ENABLED=1 go test -tags fts5 -count=1 -race -timeout 120s ./...

    build:
      run: CGO_ENABLED=1 go build -tags fts5 -o /dev/null ./cmd/...

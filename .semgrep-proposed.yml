rules:
  - id: rust.dbg-macro
    message: >
      `dbg!` is a debugging leftover and must not be committed.
      Remove it or replace with `tracing::debug!`.
    languages: [rust]
    severity: ERROR
    patterns:
      - pattern: dbg!(...)

  - id: rust.todo-unimplemented
    message: >
      `todo!`/`unimplemented!` in production code paths aborts the process.
      Track unfinished work in an issue instead.
    languages: [rust]
    severity: WARNING
    patterns:
      - pattern-either:
          - pattern: todo!()
          - pattern: unimplemented!()

  - id: rust.unsafe-block
    message: >
      Direct `unsafe` block. This workspace denies unsafe outside
      ingress/build.rs; justify with a `// SAFETY:` comment and an explicit
      `#[allow(unsafe_code)]`, or remove it.
    languages: [rust]
    severity: WARNING
    patterns:
      - pattern: unsafe { ... }
      - pattern-not-inside: |
          #[allow(unsafe_code)]
          fn $F(...) { ... }

  - id: security.sql-format-string
    message: >
      SQL built with `format!` from dynamic values risks injection if any
      input reaches the query text. Parameterize values with `?` placeholders
      (`rusqlite::params!`) and keep only trusted identifiers in the format
      string; add an inline justification comment if this call is safe.
    languages: [rust]
    severity: WARNING
    metadata:
      cwe: "CWE-89: Improper Neutralization of Special Elements used in an SQL Command"
      owasp: "A03:2021 - Injection"
    patterns:
      - pattern-either:
          - pattern: $CONN.prepare(&format!(...), ...)
          - pattern: $CONN.prepare_cached(&format!(...), ...)
          - pattern: $CONN.execute(&format!(...), ...)
          - pattern: $CONN.execute_batch(&format!(...), ...)
          - pattern: $CONN.query(&format!(...), ...)
          - pattern: $CONN.query_row(&format!(...), ...)

  - id: generic.hardcoded-secret
    message: >
      Possible hardcoded credential. Load secrets from configuration or the
      environment instead of embedding them in source.
    languages: [rust]
    severity: WARNING
    metadata:
      cwe: "CWE-798: Use of Hard-coded Credentials"
    patterns:
      - pattern-either:
          - pattern: let $VAR = "$X";
          - pattern: 'const $VAR: &str = "$X";'
      - metavariable-regex:
          metavariable: $VAR
          regex: (?i).*(password|passwd|secret|api_?key|token|credential).*

  - id: rust.std-net-in-pipeline
    message: >
      Blocking std::net calls inside the async gRPC path stall the tokio
      runtime. Use tokio::net equivalents.
    languages: [rust]
    severity: WARNING
    paths:
      include:
        - "crates/otel-sqlite-ingress/src/**"
    patterns:
      - pattern-either:
          - pattern: std::net::TcpStream::connect(...)
          - pattern: std::net::TcpListener::bind(...)

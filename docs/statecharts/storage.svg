ition" data-id="edge13"><path d="M1019.06,613L1019.06,625.25C1019.06,635.02 1166.04,641 1405.86,641C1645.68,641 1792.67,665.32 1792.67,705L1792.67,778"/><path class="pele-marker" d="M1792.67,785L1789.31,777L1796.03,777Z" fill="var(--_l)" stroke="none"/></g></g><g class="pele-edge-labels" font-size="14"><g class="pele-edge-label" data-id="edge1"><rect x="861.6" y="228.5" width="200.22" height="36" rx="3" fill="var(--_bg)"/><text text-anchor="middle" xml:space="preserve"><tspan x="961.71" y="242.4">the chunk enters its origin</tspan><tspan x="961.71" y="260.4">buffer, the first batch is queued</tspan></text></g><g class="pele-edge-label" data-id="edge2"><rect x="654.93" y="374.5" width="187.77" height="36" rx="3" fill="var(--_bg)"/><text text-anchor="middle" xml:space="preserve"><tspan x="748.82" y="388.4">the age deadline expires, the</tspan><tspan x="748.82" y="406.4">last record is queued</tspan></text></g><g class="pele-edge-label" data-id="edge3"><rect x="893.55" y="458.5" width="190.85" height="21" rx="3" fill="var(--_bg)"/><text x="988.97" y="473.9" text-anchor="middle">the writer takes the first batch</text></g><g class="pele-edge-label" data-id="edge4"><rect x="653.39" y="520.5" width="190.85" height="21" rx="3" fill="var(--_bg)"/><text x="748.82" y="535.9" text-anchor="middle">the writer takes the first batch</text></g><g class="pele-edge-label" data-id="edge5"><rect x="71.52" y="723.5" width="94.35" height="21" rx="3" fill="var(--_bg)"/><text x="118.7" y="738.9" text-anchor="middle">the writer fails</text></g><g class="pele-edge-label" data-id="edge6"><rect x="237.6" y="716" width="175.29" height="36" rx="3" fill="var(--_bg)"/><text text-anchor="middle" xml:space="preserve"><tspan x="325.25" y="729.9">the first batch commits, the</tspan><tspan x="325.25" y="747.9">ticket stays open</tspan></text></g><g class="pele-edge-label" data-id="edge7"><rect x="648.4" y="707" width="195.54" height="54" rx="3" fill="var(--_bg)"/><text text-anchor="middle" xml:space="preserve"><tspan x="746.18" y="720.9">salvage keeps one record and</tspan><tspan x="746.18" y="738.9">quarantines one, so the ticket</tspan><tspan x="746.18" y="756.9">stays open</tspan></text></g><g class="pele-edge-label" data-id="edge8"><rect x="1079.46" y="716" width="156.61" height="36" rx="3" fill="var(--_bg)"/><text text-anchor="middle" xml:space="preserve"><tspan x="1157.77" y="729.9">SQLite reports BUSY or</tspan><tspan x="1157.77" y="747.9">LOCKED</tspan></text></g><g class="pele-edge-label" data-id="edge9"><rect x="1256.07" y="723.5" width="207.96" height="21" rx="3" fill="var(--_bg)"/><text x="1360.06" y="738.9" text-anchor="middle">the writer retries the same batch</text></g><g class="pele-edge-label" data-id="edge10"><rect x="432.89" y="723.5" width="195.52" height="21" rx="3" fill="var(--_bg)"/><text x="530.65" y="738.9" text-anchor="middle">the writer takes the last record</text></g><g class="pele-edge-label" data-id="edge11"><rect x="863.95" y="723.5" width="195.52" height="21" rx="3" fill="var(--_bg)"/><text x="961.71" y="738.9" text-anchor="middle">the writer takes the last record</text></g><g class="pele-edge-label" data-id="edge12"><rect x="1488.87" y="716" width="179.95" height="36" rx="3" fill="var(--_bg)"/><text text-anchor="middle" xml:space="preserve"><tspan x="1578.84" y="729.9">the last record commits, the</tspan><tspan x="1578.84" y="747.9">ticket completes</tspan></text></g><g class="pele-edge-label" data-id="edge13"><rect x="1702.69" y="716" width="179.95" height="36" rx="3" fill="var(--_bg)"/><text text-anchor="middle" xml:space="preserve"><tspan x="1792.67" y="729.9">the last record commits, the</tspan><tspan x="1792.67" y="747.9">ticket fails</tspan></text></g></g><g class="pele-nodes"><g class="pele-node pele-state orange" data-id="s0" transform="translate(961.71,186)"><rect x="-72.02" y="-22" width="144.05" height="44" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">Chunk admitted</text></g><g class="pele-node pele-state orange" data-id="s1" transform="translate(961.71,323)"><rect x="-99.15" y="-31" width="198.3" height="62" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.9">First batch queued, last</tspan><tspan x="0" y="16.1">record buffered</tspan></text></g><g class="pele-node pele-state orange" data-id="s2" transform="translate(748.82,469)"><rect x="-114.73" y="-31" width="229.46" height="62" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.9">Both batches queued, ticket</tspan><tspan x="0" y="16.1">open</tspan></text></g><g class="pele-node pele-state purple" data-id="s3" transform="translate(961.71,591)"><rect x="-69.35" y="-22" width="138.7" height="44" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">Writing a batch</text></g><g class="pele-node pele-state tan" data-id="s4" transform="translate(118.7,807)"><rect x="-110.7" y="-22" width="221.39" height="44" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">Writer failed, ledger closed</text></g><g class="pele-node pele-state blue" data-id="s5" transform="translate(384.98,816)"><rect x="-115.58" y="-31" width="231.17" height="62" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.9">First batch committed, ticket</tspan><tspan x="0" y="16.1">open</tspan></text></g><g class="pele-node pele-state yellow" data-id="s6" transform="translate(805.91,816)"><rect x="-100.04" y="-31" width="200.08" height="62" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.9">First batch quarantined,</tspan><tspan x="0" y="16.1">ticket open</tspan></text></g><g class="pele-no
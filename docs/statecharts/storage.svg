" data-id="lg3" transform="translate(1455.43,82)"><rect x="-38.67" y="-22" width="77.34" height="44" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">Partial</text></g><g class="pele-node pele-state teal" data-id="lg4" transform="translate(1575,82)"><rect x="-40.9" y="-22" width="81.81" height="44" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">Settled</text></g><g class="pele-node pele-state tan" data-id="lg5" transform="translate(1693.69,82)"><rect x="-37.78" y="-22" width="75.57" height="44" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">Failed</text></g></g></g></svg>
[package]
name = "otel-sqlite-ingress"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
crossbeam-channel = { workspace = true }
metrics = "0.24"
otel-sqlite-core = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
# `gzip`: accept gzip-encoded OTLP requests (the OpenTelemetry Collector's
# exporter sends them by default); see grpc.rs.
tonic = { version = "0.14", features = ["tls-ring", "gzip"] }
tonic-health = { workspace = true }
tonic-prost = "0.14"
prost = "0.14"
tracing = "0.1"

[build-dependencies]
tonic-prost-build = "0.14"
protoc-bin-vendored = "3.2"

[dev-dependencies]
criterion = { workspace = true }
otel-sqlite-storage = { workspace = true }
rcgen = { workspace = true }
tempfile = { workspace = true }
tokio-stream = { workspace = true }
tracing-subscriber = { workspace = true }

[[bench]]
name = "conversion"
harness = false

[[bench]]
name = "queue"
harness = false

[lints]
workspace = true

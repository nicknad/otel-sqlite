version: "2"

run:
  timeout: 3m

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - codeberg.org/nicknad/otel-sqlite

linters:
  enable:
    # ── Standard correctness ──
    - govet
    - errcheck
    - staticcheck
    - unused
    - ineffassign

    # ── Security ──
    - gosec

    # ── Style & correctness ──
    - revive
    - misspell
    - unconvert
    - usestdlibvars
    - dupword
    - intrange
    - mirror
    - perfsprint
    - lll

    # ── Code quality ──
    - gocritic
    - nakedret
    - modernize

  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow
        - unusedwrite

    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
          severity: warning
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: if-return
          severity: warning
        - name: increment-decrement
        - name: var-naming
          severity: warning
          arguments:
            - ["ID", "URL", "HTTP", "JSON", "API", "FTS", "WAL", "OTLP", "gRPC", "TUI", "HTMX", "UI", "DB", "GC", "RSS", "MB"]
            - []
        - name: var-declaration
        - name: range
          severity: warning
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
          severity: warning
        - name: indent-error-flow
          severity: warning
        - name: errorf
        - name: empty-block
          severity: warning
        - name: superfluous-else
          severity: warning
        - name: unreachable-code
        - name: redefines-builtin-id

    gocritic:
      enable-all: true
      disabled-checks:
        - whyNoLint
        - unnamedResult
        - ifElseChain
        - appendAssign

    gosec:
      excludes:
        - G104  # unhandled errors (audit only, catches too many intentional discards)
        - G307  # deferring unsafe Close (we use sql.DB which is safe)
        - G304  # file inclusion via variable (config files are user-controlled paths)
        - G202  # SQL built from string concatenation (all fragments are fixed
                # constants; dynamic input always goes through ? placeholders)

    staticcheck:
      checks:
        - all
        - -ST1000   # package comment (not all packages need doc comments)
        - -ST1003   # underscores in names (we use snake_case in config YAML tags)
        - -ST1016   # receiver naming (enforced by revive receiver-naming instead)
        - -SA1019   # deprecated (allow gradual migration)

    lll:
      line-length: 120
      tab-width: 4

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec
          - gocritic
          - intrange
          - lll
          - modernize
          - perfsprint
      - path: internal/generated/
        linters:
          - all
      - path: vendor/
        linters:
          - all
      - path: check_indexes\.go
        linters:
          - errcheck
      - path: cmd/loadtest/
        linters:
          - errcheck
          - lll
          - intrange
          - modernize
          - perfsprint
      - path: internal/storage/sqlite/write_batch_command\.go
        linters:
          - gocritic
          - errcheck
    generated: lax

# Docker Compose profile for running the OTLP SQLite collector in a container
# for load testing. It runs ONLY the collector (no Prometheus/Grafana) with
# throughput-oriented settings and an isolated data volume.
#
# Usage:
#   podman compose -f docker-compose.loadtest.yml up -d --build
#   make loadtest-run            # runs cmd/loadtest against localhost:4317
#   podman compose -f docker-compose.loadtest.yml down -v

services:
  otel-collector:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: otel-collector-loadtest
    ports:
      - "14317:4317"   # gRPC OTLP (mapped to 14317 to avoid host conflicts)
      - "19090:9090"   # Prometheus metrics (mapped to 19090)
    volumes:
      - collector-data:/var/lib/otel-collector
    environment:
      - LISTEN_ADDRESS=:4317
      - METRICS_ADDRESS=:9090
      - SQLITE_PATH=/var/lib/otel-collector/otel-logs.db
      # Throughput-oriented tuning (see internal/config/config.go for semantics)
      - INGRESS_QUEUE_CAPACITY=200000
      - BATCH_QUEUE_CAPACITY=20000
      - BATCH_SIZE=500
      - FLUSH_INTERVAL=1s
      - SHUTDOWN_TIMEOUT=30s
    restart: "no"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  collector-data:
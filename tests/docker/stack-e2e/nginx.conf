# nginx site config for the stack E2E topology.
#
# Mounted as /etc/nginx/conf.d/default.conf (the official image's main
# config stays in charge of events/http context).
#
# Log destination is deliberately `access-e2e.log`, NOT the default
# `access.log`: the official entrypoint symlinks access.log/error.log to
# stdout when they do not exist, which would defeat the shared-volume
# filelog tailing on the collector side. A distinct filename keeps the
# real file intact inside the volume.

server {
    listen 80;
    server_name _;

    # Real file, combined format (default), tailed by otelcol's filelog.
    access_log /var/log/nginx/access-e2e.log;

    # Reverse proxy: API traffic goes to the separate backend container.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }

    # Frontend: static content served directly by nginx.
    location / {
        root /var/www;
        index index.html;
    }
}

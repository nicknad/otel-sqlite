# Stack E2E: full multi-container topology against the production sink.
#
#   nginx (frontend + reverse proxy) ──> backend container
#     │ access log (file)                    │ OTLP/HTTP JSON logs
#     ▼                                      ▼
#   opentelemetry-collector-contrib (filelog + otlp receivers)
#     │ OTLP/gRPC
#     ▼
#   otel-sqlite sidecar ──> SQLite on shared volume <── verify (read-only)
#                                │
#                                └──> explorer (read-only web UI)
#
# Run:
#   docker compose -f tests/docker/compose.stack-e2e.yml up --build \
#       --exit-code-from verify
#
# The `verify` service drives HTTP traffic through nginx, then polls the
# sink database until both sources (nginx filelog lines, backend OTLP
# records) are persisted; its exit code is the stack verdict. Fresh state
# per run: `docker compose -f tests/docker/compose.stack-e2e.yml down -v`.
#
# Restricted-environment resource profile (Compose v2 honours cpus and
# mem_limit outside swarm):
#   * otel-sqlite: 2 CPUs / 512 MiB - the sidecar budget under test;
#   * collector: 0.5 CPU / 256 MiB, with memory_limiter percentages inside
#     otelcol.yaml sized relative to that cap;
#   * nginx/backend: 0.25 CPU each - realistic small sidecars;
#   * verify runs free-ish so the harness is never the bottleneck.
# Observe live usage with `docker stats` while the run is in flight.

name: otel-sqlite-stack-e2e

x-bench-image: &bench-image otel-sqlite-bench:latest

services:
  # ---------------------------------------------------------------------------
  # System under test: production sink, capped at the documented 2-CPU budget.
  # ---------------------------------------------------------------------------
  otel-sqlite:
    image: *bench-image
    build:
      context: ../..
      dockerfile: tests/docker/Dockerfile.benchmark
    container_name: stack-otel-sqlite
    working_dir: /data
    environment:
      RUST_LOG: info
      OTEL_SQLITE_CFG_PATH: /etc/otel-sqlite/otel-sqlite.toml
    volumes:
      - ./stack-e2e/otel-sqlite.toml:/etc/otel-sqlite/otel-sqlite.toml:ro
      - stack-data:/data
    restart: unless-stopped
    mem_limit: 512m
    cpus: "2"
    # Built-in gRPC HEALTHCHECK ships with the image.

  # ---------------------------------------------------------------------------
  # Telemetry pipeline under test: contrib collector bridging both sources
  # into the sink's OTLP/gRPC ingress. Pinned to a release tag on ghcr.io
  # (the Docker Hub otel/opentelemetry-collector-contrib repo is frozen).
  # ---------------------------------------------------------------------------
  otelcol:
    image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.159.0
    container_name: stack-otelcol
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./stack-e2e/otelcol.yaml:/etc/otelcol/config.yaml:ro
      - nginx-logs:/var/log/nginx:ro
    depends_on:
      otel-sqlite:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 256m
    cpus: "0.5"
    # NOTE: no compose healthcheck is possible here - the release image is
    # distroless (no sh/bash/wget), only /otelcol-contrib exists. Ordering
    # is handled by service_started plus the verifier's retry/poll logic;
    # if the collector were down, sink counts would never converge and
    # `verify` fails the run anyway.

  # ---------------------------------------------------------------------------
  # Traffic topology: static frontend + reverse proxy, separate API backend.
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.29-alpine
    container_name: stack-nginx
    volumes:
      - ./stack-e2e/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./stack-e2e/frontend:/var/www:ro
      # Real access log file lives here; the entrypoint only symlinks the
      # DEFAULT names (access.log/error.log), not access-e2e.log.
      - nginx-logs:/var/log/nginx
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
    mem_limit: 64m
    cpus: "0.25"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      start_period: 3s
      retries: 6

  backend:
    image: stack-backend:latest
    build:
      context: ./stack-e2e
      dockerfile: Dockerfile.backend
    container_name: stack-backend
    environment:
      OTEL_ENDPOINT: http://otelcol:4318
      BACKEND_HEARTBEAT_SECS: "5"
    depends_on:
      otelcol:
        condition: service_started
    restart: unless-stopped
    mem_limit: 96m
    cpus: "0.25"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u; u.urlopen('http://127.0.0.1:8080/api/health', timeout=2)"
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 12

  # ---------------------------------------------------------------------------
  # Observability: read-only log-explorer UI over the shared sink database.
  # Built from the sibling otel-sqlite-explorer checkout; opens SQLite
  # mode=ro with query_only, so it can mount the data volume as-is.
  # ---------------------------------------------------------------------------
  explorer:
    image: log-explorer:latest
    build:
      context: ../../../otel-sqlite-explorer
      dockerfile: Dockerfile
    container_name: stack-explorer
    # Image CMD is already "-db /data/otel-logs.db -addr :8080"; spelled out
    # here so the dependency on the sink's layout stays visible in one place.
    command: ["-db", "/data/otel-logs.db", "-addr", ":8080"]
    volumes:
      - stack-data:/data
    depends_on:
      otel-sqlite:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 128m
    cpus: "0.25"
    # No compose healthcheck: the debian-slim runtime ships no probe tools,
    # and the verifier retries HTTP anyway (see get_with_retry).

  # ---------------------------------------------------------------------------
  # Verdict: drives traffic through nginx, validates SQLite persistence.
  # ---------------------------------------------------------------------------
  verify:
    image: *bench-image
    build:
      context: ../..
      dockerfile: tests/docker/Dockerfile.benchmark
    container_name: stack-verify
    entrypoint: ["/usr/local/bin/otel-sqlite-stack-verify"]
    environment:
      STACK_FRONTEND_URL: http://nginx
      STACK_EXPLORER_URL: http://explorer:8080/
      STACK_REQUESTS: "${STACK_REQUESTS:-24}"
      STACK_DB_PATH: /data/otel-logs.db
      STACK_SETTLE_SECS: "${STACK_SETTLE_SECS:-90}"
      RUST_LOG: warn
    volumes:
      - stack-data:/data
    depends_on:
      otel-sqlite:
        condition: service_healthy
      otelcol:
        condition: service_started
      nginx:
        condition: service_healthy
      backend:
        condition: service_healthy
      explorer:
        condition: service_started

volumes:
  stack-data:
  nginx-logs:

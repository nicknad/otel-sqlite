[package]
name = "otel-sqlite-e2e"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "End-to-end OTLP -> ingress -> queue -> SQLite benchmark harness"
publish = false

[lib]
name = "otel_sqlite_e2e"
path = "src/lib.rs"

[[bin]]
name = "otel-sqlite-e2e"
path = "src/main.rs"

# Verifier for the full container stack (tests/docker/compose.stack-e2e.yml):
# drives HTTP traffic through nginx/backend/otelcol and asserts persistence.
[[bin]]
name = "otel-sqlite-stack-verify"
path = "src/bin/stack_verify.rs"

# Crash/restart durability driver for tests/docker/compose.crash-e2e.yml: drives
# OTLP load against the sidecar, writes outcome manifests, validates them
# after a docker-kill + restart. Shares crash.rs with the native test.
[[bin]]
name = "otel-sqlite-stack-crash"
path = "src/bin/stack_crash.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
crossbeam-channel = { workspace = true }
hdrhistogram = { workspace = true }
metrics = { workspace = true }
otel-sqlite-core = { workspace = true }
otel-sqlite-ingress = { workspace = true }
otel-sqlite-storage = { workspace = true }
rand = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["net"] }
toml = { workspace = true }
tonic = "0.14"
tracing = "0.1"
tracing-subscriber = { workspace = true }

[dev-dependencies]
tempfile = "3"
criterion = { workspace = true }

[[bench]]
name = "pipeline"
harness = false

[lints]
workspace = true

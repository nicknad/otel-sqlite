# Docker Compose override: run the load-test collector with a SEPARATE
# SQLite database for OTLP metrics (metrics_sqlite_path). Use together with
# the base file so the metrics writer + batcher pipeline get their own file
# and the metrics write load no longer shares the log writer:
#
#   docker compose -f docker-compose.loadtest.yml \
#                  -f docker-compose.loadtest-separate.yml up -d --build
#   make loadtest-baseline-{logs,metrics,mixed}   # client only, no compose
#   docker compose -f docker-compose.loadtest.yml \
#                  -f docker-compose.loadtest-separate.yml down -v
#
# The metrics DB lives in the same named volume as the log DB so both files
# survive the run and can be inspected after down (without -v).

services:
  otel-collector:
    environment:
      - METRICS_SQLITE_PATH=/var/lib/otel-collector/otel-metrics.db

# OTLP SQLite Collector Configuration
# 
# This file contains example configuration for the OTLP log collector.
# All settings can also be provided via environment variables.
# Environment variables take precedence over file configuration.
#
# To use a config file, set the CONFIG_FILE environment variable:
#   export CONFIG_FILE=/path/to/config.yaml

# Server configuration
listen_address: ":4317"          # gRPC server listen address
metrics_address: ":9090"        # Prometheus metrics server address

# gRPC configuration
grpc_max_recv_msg_size: 16777216  # Max gRPC receive message size in bytes (default: 16 MB)
grpc_max_send_msg_size: 16777216  # Max gRPC send message size in bytes (default: 16 MB)
grpc_max_concurrent_streams: 100  # Max concurrent gRPC streams per connection (default: 100)

# Backpressure: early rejection threshold (0 = disabled).
# When ingress queue exceeds this fraction of capacity, new requests are
# rejected with Unavailable instead of blocking. Recommended: 0.8
# ingress_queue_backpressure_threshold: 0.8

# Go runtime memory limit in MB (0 = disabled).
# Recommended: set to ~80% of your container memory limit (e.g. 1600 for 2 GB).
# go_memory_limit_mb: 1600

# SQLite configuration
sqlite_path: "otel-logs.db"      # Path to SQLite database file

# Ingestion pipeline configuration
ingress_queue_capacity: 10000   # Maximum number of log records in ingress queue
batch_queue_capacity: 1000      # Maximum number of batches in batch queue

# Batcher configuration (groups records into WriteBatchCommand objects)
batcher_batch_size: 250         # Number of log records per batch (batcher)
batcher_flush_interval: "5s"    # Maximum time between batch flushes

# Writer configuration (groups commands into SQLite transactions)
writer_batch_size: 100          # Number of commands per transaction (writer)
writer_flush_interval: "5s"     # Maximum time between transaction flushes
writer_max_transaction_records: 5000  # Max records per SQLite transaction

# Legacy batching configuration (applies to both batcher and writer
# if the specific fields above are not set)
# batch_size: 100
# flush_interval: "5s"

# Timeouts
shutdown_timeout: "30s"         # Graceful shutdown timeout

# ---------------------------------------------------------------------------
# Notification pipeline configuration
# ---------------------------------------------------------------------------
# The notification pipeline sends alerts when error-level log records are
# ingested. It evaluates rules, tracks alert state (pending → firing →
# resolved), and delivers notifications via pluggable notifiers.
#
# Alert pipeline flow:
#   ERROR → time window → counter → state → alert → notification
#
# Rules are evaluated in order; the first matching rule wins.
# Each rule maps to a destination, which references a notifier by name.
#
# Each rule-resource pair creates one Alert. Events within the alert_window
# are counted; when the count reaches alert_threshold, the alert fires.
# After alert_resolve_window of silence, the alert auto-resolves.
#
# Built-in notifier types:
#   "log"  — writes to the application log (development/testing)
#   "http" — POSTs JSON to a configurable URL with optional auth header
#
# Delivery state (retry count, cooldown) is persisted in a bbolt KV store
# at store_path. Alert state is persisted at alert_store_path.
#
# notification:
#   enabled: true
#   event_queue_depth: 1000
#   store_path: "notify-state.db"
#   alert_store_path: "alert-state.db"
#   retry_interval: "30s"
#   gc_interval: "5m"
#   notifiers:
#     slack:
#       type: "http"
#       url: "https://hooks.slack.com/services/..."
#       timeout: "10s"
#       auth_header: ""
#     dev:
#       type: "log"
#   rules:
#     - name: "production-errors"
#       match_severity: "ERROR"
#       resource_filter: ".*production.*"
#       cooldown: "5m"
#       max_retries: 3
#       retry_backoff: "30s"
#       alert_window: "5m"
#       alert_threshold: 3
#       alert_resolve_window: "15m"
#       destination: "slack"
#     - name: "fatal-to-log"
#       match_severity: "FATAL"
#       resource_filter: ".*production.*"
#       body_filter: "(?i)panic"
#       cooldown: "1m"
#       alert_threshold: 1
#       destination: "dev"

# ---------------------------------------------------------------------------
# Maintenance framework configuration
# ---------------------------------------------------------------------------
# The maintenance framework schedules periodic database tasks. Each task is
# independently configurable and can be disabled. Tasks NEVER access SQLite
# directly; all mutations flow through the Command Queue → SQLite Writer.
#
# Duration values support Go duration strings ("1h", "30m") and "d" for days:
#   30d, 7d, 365d, etc.

maintenance:
  enabled: true                  # Master switch for the maintenance worker
  check_interval: "1h"           # How often the worker evaluates tasks

# Retention: purges log records older than keep_logs.
# Runs on its own cleanup_interval, independent of check_interval.
retention:
  enabled: true
  keep_logs: "30d"               # Delete logs older than this
  cleanup_interval: "24h"        # How often to run retention
  delete_batch_size: 10000      # Max records per delete batch

# Checkpoint: runs SQLite WAL checkpoint to keep WAL file size bounded.
checkpoint:
  enabled: true
  interval: "24h"
  mode: "PASSIVE"        # PASSIVE | FULL | RESTART | TRUNCATE

# Optimize: runs PRAGMA optimize to update query planner statistics.
optimize:
  enabled: true
  interval: "24h"

# Vacuum: rebuilds the database file to reclaim disk space.
# Disabled by default since it requires an exclusive lock.
vacuum:
  enabled: false
  interval: "7d"

# FTS rebuild: drops and recreates the logs_fts contentless FTS5 index
# and populates it from the logs view. Runs serialized with ingestion
# on the single writer, guaranteeing consistency. Full rebuild also
# serves as GC for entries orphaned by retention.
fts:
  enabled: true
  rebuild_interval: "1h"

# ---------------------------------------------------------------------------
# Environment variable reference (all config fields)
# ---------------------------------------------------------------------------
# Core:
#   LISTEN_ADDRESS          - gRPC server address (default: :4317)
#   SQLITE_PATH             - Database file path (default: otel-logs.db)
#   METRICS_ADDRESS                   - Prometheus metrics address (default: :9090)
#   GRPC_MAX_RECV_MSG_SIZE            - Max gRPC receive message size in bytes (default: 16777216)
#   GRPC_MAX_SEND_MSG_SIZE            - Max gRPC send message size in bytes (default: 16777216)
#   GRPC_MAX_CONCURRENT_STREAMS       - Max concurrent gRPC streams (default: 100)
#   INGRESS_QUEUE_BACKPRESSURE_THRESHOLD - Queue fullness fraction (0–1) for early rejection (default: 0 = disabled)
#   GO_MEMORY_LIMIT_MB                - Go runtime memory limit in MB (default: 0 = disabled)
#
# Pipeline:
#   INGRESS_QUEUE_CAPACITY          - Ingress queue capacity (default: 10000)
#   BATCH_QUEUE_CAPACITY            - Command queue capacity (default: 1000)
#   BATCHER_BATCH_SIZE              - Records per batcher batch (default: 250)
#   BATCHER_FLUSH_INTERVAL          - Max batcher flush interval (default: 5s)
#   WRITER_BATCH_SIZE               - Commands per writer transaction (default: 100)
#   WRITER_FLUSH_INTERVAL           - Max writer flush interval (default: 5s)
#   WRITER_MAX_TRANSACTION_RECORDS  - Max records per SQLite transaction (default: 5000)
#   (Legacy: BATCH_SIZE/FLUSH_INTERVAL also accepted, apply to both batcher and writer)
#   SHUTDOWN_TIMEOUT                - Graceful shutdown timeout (default: 30s)
#
# Maintenance:
#   CONFIG_FILE             - Path to YAML config file
#   MAINTENANCE_ENABLED     - Master switch (default: true)
#   MAINTENANCE_CHECK_INTERVAL - Worker evaluation interval (default: 1h)
#
# Notification:
#   NOTIFICATION_ENABLED              - Enable notification pipeline (default: false)
#   NOTIFICATION_EVENT_QUEUE_DEPTH    - Notification event queue capacity (default: 1000)
#   NOTIFICATION_STORE_PATH           - Path to notification delivery state store (default: notify-state.db)
#   NOTIFICATION_ALERT_STORE_PATH     - Path to alert state store (default: alert-state.db)
#   NOTIFICATION_RETRY_INTERVAL       - Retry scan interval (default: 30s)
#   NOTIFICATION_GC_INTERVAL          - Resolved alert GC interval (default: 5m)
#
# Task-specific (env overrides use Go durations, not "d" suffix):
#   RETENTION_ENABLED           (default: true)
#   RETENTION_KEEP_LOGS         (default: 720h i.e. 30d)
#   RETENTION_CLEANUP_INTERVAL  (default: 24h)
#   RETENTION_DELETE_BATCH_SIZE (default: 10000)
#   CHECKPOINT_ENABLED          (default: true)
#   CHECKPOINT_INTERVAL         (default: 24h)
#   CHECKPOINT_MODE             (default: PASSIVE)
#   OPTIMIZE_ENABLED            (default: true)
#   OPTIMIZE_INTERVAL           (default: 24h)
#   VACUUM_ENABLED              (default: false)
#   VACUUM_INTERVAL             (default: 168h i.e. 7d)
#   FTS_ENABLED                 (default: true)
#   FTS_REBUILD_INTERVAL        (default: 1h)
